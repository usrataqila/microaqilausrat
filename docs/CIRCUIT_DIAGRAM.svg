<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1000" width="1420" height="1000" font-family="Segoe UI, system-ui, sans-serif">
<style>
  .t   { font-size:13.5px; font-weight:700; fill:#111 }
  .s   { font-size:11.5px; fill:#333 }
  .p   { font-size:10px; fill:#111; font-weight:700 }
  .lb  { font-size:10px; font-weight:700 }
  .n   { font-size:10.5px; fill:#666; font-style:italic }
  .box { fill:#fdfdfd; stroke:#1a1a1a; stroke-width:2 }

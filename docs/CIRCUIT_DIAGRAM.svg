<polyline points="530,436 638,436 638,660 704,660" class="c" stroke="#444"/>
<text x="644" y="430" class="p">J2 GND → G</text>

<!-- IN1 -> D6 and IN2 -> D7, routed under the ESP to the right header -->
<polyline points="530,454 552,454 552,860 900,860 900,538 860,538" class="c" stroke="#e08c00"/>

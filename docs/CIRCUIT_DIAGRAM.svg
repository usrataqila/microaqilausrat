<rect width="1420" height="1000" fill="#ffffff"/>
<text x="30" y="36" class="t" font-size="20">microaqila — circuit diagram (as built)</text>
<text x="30" y="57" class="n">Layout matches the bench photo · NodeMCU ESP8266 · DHT22 · SSD1306 OLED · 2-channel relay · 12 V fan + 12 V bulb</text>


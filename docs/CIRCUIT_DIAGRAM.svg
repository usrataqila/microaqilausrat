<polyline points="530,472 536,472 536,890 924,890 924,562 860,562" class="c" stroke="#7a4fbf"/>
<text x="606" y="884" class="p" fill="#5a3a90">IN2 → D7   (K2 fan)</text>

<!-- ================= OLED WIRING ================= -->
<polyline points="1157,242 1157,268 948,268 948,466 860,466" class="c" stroke="#2255cc"/>
<text x="960" y="262" class="p" fill="#2255cc">SCL → D1</text>
<polyline points="1197,242 1197,290 972,290 972,490 860,490" class="c" stroke="#7a4fbf"/>
<text x="984" y="284" class="p" fill="#5a3a90">SDA → D2</text>
<polyline points="1115,242 1115,258 640,258 640,160 676,160" class="c" stroke="#c0392b"/>
<text x="700" y="252" class="p" fill="#922">VCC → + rail</text>
<polyline points="1074,242 1074,306 624,306 624,184 692,184" class="c" stroke="#2b2b2b"/>
<text x="700" y="300" class="p">GND → − rail</text>

<!-- rails fed from the ESP -->
<polyline points="860,586 880,586 880,690 676,690" class="c" stroke="#c0392b"/>
<text x="716" y="684" class="p" fill="#922">3V → + rail</text>
<polyline points="860,610 862,610 862,720 692,720" class="c" stroke="#2b2b2b"/>
<text x="716" y="714" class="p">G → − rail</text>

<!-- ================= DHT WIRING ================= -->
<polyline points="1104,448 1104,514 996,514 996,514 860,514" class="c" stroke="#2a9d4a"/>
<text x="1000" y="508" class="p" fill="#1a7a34">out → D5</text>
<polyline points="1066,448 1066,470 1020,470 1020,594 940,594 940,586 860,586" class="c" stroke="#c0392b"/>
<text x="944" y="588" class="p" fill="#922">+ → 3V</text>
<polyline points="1148,448 1148,640 916,640 916,610 860,610" class="c" stroke="#2b2b2b"/>
<text x="944" y="634" class="p">− → G</text>

<!-- ================= NOTES ================= -->
<rect x="985" y="676" width="405" height="252" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
<text x="1003" y="700" class="t">Notes</text>
<text x="1003" y="724" class="s">• Relays are LOW-trigger — GPIO LOW switches the relay ON.</text>
<text x="1003" y="746" class="s">• Both loads sit on NO contacts, so a reset, crash or power</text>
<text x="1003" y="762" class="s">   cut leaves the fan and bulb OFF. Fail-safe by construction.</text>
<text x="1003" y="784" class="s">• J1 jumper REMOVED — split supply: coils from VU (5 V),</text>
<text x="1003" y="800" class="s">   opto input side from 3V, matching the ESP's 3.3 V logic.</text>
<text x="1003" y="822" class="s">• D3 / D4 / D8 deliberately avoided — boot-strapping pins.</text>
<text x="1003" y="844" class="s">• The 12 V side never touches the ESP. The only connection</text>
<text x="1003" y="860" class="s">   is the relay contact, which is mechanically isolated.</text>
<text x="1003" y="886" class="s" fill="#a11">• 3 A fuse and 105 °C thermal cutout have been REMOVED.</text>
<text x="1003" y="902" class="s" fill="#a11">   Both must be refitted in the K1 branch before the bulb</text>
<text x="1003" y="918" class="s" fill="#a11">   is run.</text>

<!-- ================= LEGEND ================= -->
<line x1="300" y1="946" x2="336" y2="946" class="w" stroke="#d22"/><text x="343" y="950" class="s">12 V +</text>

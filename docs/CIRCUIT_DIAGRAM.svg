<line x1="700" y1="946" x2="736" y2="946" class="c" stroke="#2a9d4a"/><text x="743" y="950" class="s">sensor data</text>
<line x1="840" y1="946" x2="876" y2="946" class="c" stroke="#7a4fbf"/><text x="883" y="950" class="s">I²C / signal</text>
</svg>
